<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>John Camera Store - 二手相機與濾鏡管理系統</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c1e;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #2e2e32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; }
    
    header { text-align: center; margin-bottom: 24px; position: relative; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .subtitle { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
    .sync-status { font-size: 0.75rem; margin-top: 6px; color: var(--accent-color); }

    .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    .category-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; text-align: center; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px; }
    .category-card:active { transform: scale(0.98); background: #252528; }
    .category-count { font-size: 0.8rem; color: var(--text-sub); font-weight: normal; margin-top: 4px; }
    .category-card.archived-card { grid-column: span 2; border-color: #374151; background: #18181b; color: #9ca3af; }

    .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 1rem; transition: background 0.2s; }
    .btn-primary { background-color: var(--accent-color); color: white; margin-bottom: 16px; }
    .btn-primary:active { background-color: var(--accent-hover); }
    .btn-secondary { background: #27272a; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-success { background-color: var(--success-color); color: white; }
    .btn-danger { background-color: var(--danger-color); color: white; }

    .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .back-btn { background: none; border: none; color: var(--accent-color); font-size: 1rem; cursor: pointer; font-weight: 600; }

    .item-list { display: flex; flex-direction: column; gap: 12px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; cursor: pointer; position: relative; user-select: none; -webkit-user-select: none; }
    .item-card:active { background: #252528; }
    .item-img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #27272a; flex-shrink: 0; }
    .item-info { flex: 1; overflow: hidden; }
    .item-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 0.8rem; color: var(--text-sub); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; align-self: flex-start; }
    .badge-in { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-out { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 500; }
    .form-control { width: 100%; padding: 10px 12px; background: #18181b; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; }
    .form-control:focus { outline: none; border-color: var(--accent-color); }
    textarea.form-control { min-height: 80px; resize: vertical; }

    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 6px 12px; background: #27272a; border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.85rem; cursor: pointer; color: var(--text-sub); user-select: none; -webkit-user-select: none; }
    .chip.selected { background: var(--accent-color); color: white; border-color: var(--accent-color); }
    .chip-add { background: transparent; border: 1px dashed var(--accent-color); color: var(--accent-color); }

    .img-upload-box { width: 100%; height: 140px; border: 2px dashed var(--border-color); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--text-sub); overflow: hidden; position: relative; }
    .img-upload-box img { width: 100%; height: 100%; object-fit: contain; }

    .ai-box { background: #18181b; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-size: 0.85rem; color: #d1d5db; white-space: pre-wrap; margin-bottom: 8px; min-height: 60px; word-break: break-all; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. 分類選單頁面 -->
  <div id="step1">
    <header>
      <h1>John Camera Store</h1>
      <div class="subtitle">二手相機與濾鏡管理系統</div>
      <div id="syncStatus" class="sync-status">雲端同步狀態：未設定 URL</div>
    </header>
    <div class="category-grid" id="categoryGrid"></div>
  </div>

  <!-- 2. 器材列表頁面 -->
  <div id="step2" class="hidden">
    <div class="nav-bar">
      <button class="back-btn" onclick="showStep1()">← 返回</button>
      <h2 id="listTitle" style="font-size: 1.2rem;">列表</h2>
      <div style="width: 40px;"></div>
    </div>
    <button class="btn btn-primary" id="addNewBtn" onclick="showForm()">+ 新增器材</button>
    <div class="item-list" id="itemList"></div>
  </div>

  <!-- 3. 新增/編輯表單頁面 -->
  <div id="step3" class="hidden">
    <div class="nav-bar">
      <button class="back-btn" onclick="showStep2()">← 取消</button>
      <h2 id="formTitle" style="font-size: 1.2rem;">新增器材</h2>
      <div style="width: 40px;"></div>
    </div>

    <form id="equipmentForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label>1. 器材圖片 (可拍攝/上傳)</label>
        <div class="img-upload-box" onclick="document.getElementById('fileInput').click()">
          <span id="uploadPlaceholder">📷 點擊拍攝或選擇照片</span>
          <img id="previewImg" class="hidden" src="" alt="預覽">
        </div>
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
      </div>

      <div class="form-group">
        <label>Model 型號/品名</label>
        <input type="text" id="model" class="form-control" placeholder="請輸入型號" required oninput="generateAiText()">
      </div>

      <div class="form-group">
        <label>品牌</label>
        <div class="chip-group" id="brandChips"></div>
      </div>

      <div class="form-group" id="groupBorders">
        <label>邊框顏色</label>
        <div class="chip-group" id="borderChips"></div>
      </div>

      <div class="form-group" id="groupGlasses">
        <label>玻璃顏色</label>
        <div class="chip-group" id="glassChips"></div>
      </div>

      <div class="form-group" id="groupAccType">
        <label>配件類別</label>
        <div class="chip-group" id="accTypeChips"></div>
      </div>

      <div class="form-group">
        <label>Condition 品項狀況</label>
        <div class="chip-group" id="conditionChips"></div>
      </div>

      <div class="form-group">
        <label>原裝包裝/盒裝</label>
        <div class="chip-group" id="packageChips"></div>
      </div>

      <div class="form-group">
        <label>功能描述/備註</label>
        <textarea id="functionDesc" class="form-control" placeholder="請輸入功能細節或商品狀況" oninput="generateAiText()"></textarea>
      </div>

      <div class="form-group">
        <label>存放位置/編號</label>
        <input type="text" id="location" class="form-control" placeholder="例: 防潮箱 A-1">
      </div>

      <div class="form-group">
        <label>售出紀錄 / 狀態</label>
        <div class="chip-group" id="soldChips"></div>
      </div>

      <div class="form-group" style="margin-top: 24px;">
        <label>🤖 AI 估價與賣場格式生成</label>
        <div id="aiPreview" class="ai-box">系統將自動產生格式...</div>
        <button type="button" class="btn btn-secondary" onclick="copyAiText()">複製賣場內文</button>
      </div>

      <button type="submit" id="saveBtn" class="btn btn-success">儲存資料並同步至雲端</button>
    </form>
  </div>

<script>
  // 🔗 Google Apps Script 部署 URL 貼於下方
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyy4J8-ID77mm9syXAERTg9SYdlUEVWFxgR9L_u3SVbMGNfQhhElfN6w31sgBteAjCVw/exec';

  const categories = ['Filter', '鏡頭', '相機', '機身', '前後蓋', '配件雜項'];

  // 預設固定選項
  const presetBrands = ['Nikon', 'Canon', 'Sony', 'Fujifilm', 'Leica'];
  const presetBordersFilter = ['銀', '黑', '銀黑', '香檳金'];
  const presetBordersGeneral = ['銀', '黑', '銀黑'];
  const presetGlasses = ['透明', '紅', '橙', '黃', '綠', '藍', '紫', '粉紅', '黑', 'Amber', '暖色'];
  const presetAccTypes = ['相機帶', '袋', '遮光罩', '眼罩'];

  let customBrands = JSON.parse(localStorage.getItem('jcs_brands')) || [...presetBrands];
  let customBordersFilter = JSON.parse(localStorage.getItem('jcs_border_filter')) || [...presetBordersFilter];
  let customBordersGeneral = JSON.parse(localStorage.getItem('jcs_border_general')) || [...presetBordersGeneral];
  let customGlasses = JSON.parse(localStorage.getItem('jcs_glasses')) || [...presetGlasses];
  let customAccessoryTypes = JSON.parse(localStorage.getItem('jcs_acc_types')) || [...presetAccTypes];

  let db = JSON.parse(localStorage.getItem('john_camera_db')) || [];

  let currentCategory = 'Filter';
  let editingId = null;
  let currentImageData = '';
  let formState = {};

  // 雲端同步：讀取
  async function fetchCloudData() {
    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('YOUR_GOOGLE_SCRIPT_URL')) return;
    showStatus('🔄 正在同步雲端最新資料...');
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL);
      const data = await res.json();
      if (Array.isArray(data)) {
        db = data;
        localStorage.setItem('john_camera_db', JSON.stringify(db));
        renderCategories();
        if (!document.getElementById('step1').classList.contains('hidden')) {}
        else if (!document.getElementById('step2').classList.contains('hidden')) { renderEquipmentList(); }
      }
      showStatus('✅ 雲端同步完成！');
    } catch (e) {
      showStatus('⚠️ 雲端同步失敗，載入本地資料');
    }
  }

  // 雲端同步：寫入
  async function syncToCloud() {
    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('YOUR_GOOGLE_SCRIPT_URL')) return;
    showStatus('☁️ 正在上傳同步至雲端...');
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'save', items: db })
      });
      showStatus('✅ 儲存並同步成功！');
    } catch (e) {
      showStatus('⚠️ 雲端同步失敗，已存於本機');
    }
  }

  function showStatus(text) {
    document.getElementById('syncStatus').innerText = text;
  }

  // 頁面切換
  function showStep1() {
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.add('hidden');
    renderCategories();
  }

  function showStep2(cat) {
    if (cat) currentCategory = cat;
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    document.getElementById('step3').classList.add('hidden');

    if (currentCategory === '__ARCHIVED__') {
      document.getElementById('listTitle').innerText = '已下架 / 已售出商品';
      document.getElementById('addNewBtn').classList.add('hidden');
    } else {
      document.getElementById('listTitle').innerText = `${currentCategory} 總覽`;
      document.getElementById('addNewBtn').classList.remove('hidden');
    }
    renderEquipmentList();
  }

  // 首頁渲染（包含已下架分區）
  function renderCategories() {
    const grid = document.getElementById('categoryGrid');
    grid.innerHTML = '';
    
    // 一般分類
    categories.forEach(cat => {
      const count = db.filter(item => item.category === cat && item.status !== '已售出').length;
      const card = document.createElement('div');
      card.className = 'category-card';
      card.onclick = () => showStep2(cat);
      card.innerHTML = `${cat} <div class="category-count">${count} 件在庫</div>`;
      grid.appendChild(card);
    });

    // 已下架 / 已售出專區
    const archivedCount = db.filter(item => item.status === '已售出').length;
    const archivedCard = document.createElement('div');
    archivedCard.className = 'category-card archived-card';
    archivedCard.onclick = () => showStep2('__ARCHIVED__');
    archivedCard.innerHTML = `📦 已下架商品 <div class="category-count">${archivedCount} 件已售出</div>`;
    grid.appendChild(archivedCard);
  }

  // 器材列表渲染 (支援長按與右鍵刪除)
  function renderEquipmentList() {
    const list = document.getElementById('itemList');
    list.innerHTML = '';

    let items = [];
    if (currentCategory === '__ARCHIVED__') {
      items = db.filter(item => item.status === '已售出');
    } else {
      items = db.filter(item => item.category === currentCategory && item.status !== '已售出');
    }

    if (items.length === 0) {
      list.innerHTML = `<div style="text-align:center; color: var(--text-sub); padding: 40px 0;">尚無資料</div>`;
      return;
    }

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';

      // 點擊編輯
      card.onclick = () => showForm(item.id);

      // 長按 / 右鍵 刪除邏輯
      let pressTimer = null;
      const startPress = () => {
        pressTimer = setTimeout(() => {
          deleteEquipment(item.id, item.model);
        }, 800);
      };
      const cancelPress = () => { if (pressTimer) clearTimeout(pressTimer); };

      card.addEventListener('touchstart', startPress);
      card.addEventListener('touchend', cancelPress);
      card.addEventListener('touchmove', cancelPress);
      card.addEventListener('mousedown', startPress);
      card.addEventListener('mouseup', cancelPress);
      card.addEventListener('mouseleave', cancelPress);
      card.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        deleteEquipment(item.id, item.model);
      });

      const isSold = item.status === '已售出';
      const imgUrl = item.image || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="%23666" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/></svg>';

      card.innerHTML = `
        <img class="item-img" src="${imgUrl}" alt="photo">
        <div class="item-info">
          <div class="item-title">${item.brand ? item.brand + ' ' : ''}${item.model || '未命名'}</div>
          <div class="item-sub">Condition: ${item.condition || '未設定'} | 位置: ${item.location || '未設定'}</div>
        </div>
        <span class="badge ${isSold ? 'badge-out' : 'badge-in'}">${isSold ? '已售出' : '在庫'}</span>
      `;
      list.appendChild(card);
    });
  }

  // 刪除產品功能
  function deleteEquipment(id, name) {
    if (confirm(`確定要刪除「${name || '此器材'}」嗎？`)) {
      db = db.filter(item => item.id !== id);
      localStorage.setItem('john_camera_db', JSON.stringify(db));
      renderEquipmentList();
      renderCategories();
      syncToCloud();
    }
  }

  // 顯示表單
  function showForm(id = null) {
    editingId = id;
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');

    if (id) {
      document.getElementById('formTitle').innerText = '編輯器材';
      const item = db.find(x => x.id === id);
      formState = { ...item };
      currentImageData = item.image || '';
    } else {
      document.getElementById('formTitle').innerText = `新增 ${currentCategory}`;
      formState = {
        category: currentCategory,
        brand: '',
        model: '',
        border: '',
        glass: '',
        accType: '',
        condition: 'A',
        package: '無', // 預設新增的「無」
        functionDesc: '',
        location: '',
        status: '在庫'
      };
      currentImageData = '';
    }

    // 圖片預覽
    const previewImg = document.getElementById('previewImg');
    const placeholder = document.getElementById('uploadPlaceholder');
    if (currentImageData) {
      previewImg.src = currentImageData;
      previewImg.classList.remove('hidden');
      placeholder.classList.add('hidden');
    } else {
      previewImg.src = '';
      previewImg.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }

    document.getElementById('model').value = formState.model || '';
    document.getElementById('functionDesc').value = formState.functionDesc || '';
    document.getElementById('location').value = formState.location || '';

    // 動態開關欄位
    const cat = editingId ? formState.category : currentCategory;
    document.getElementById('groupBorders').style.display = (cat === 'Filter' || cat === '鏡頭') ? 'block' : 'none';
    document.getElementById('groupGlasses').style.display = (cat === 'Filter') ? 'block' : 'none';
    document.getElementById('groupAccType').style.display = (cat === '配件雜項') ? 'block' : 'none';

    renderFormChips();
    generateAiText();
  }

  // 渲染動態選項標籤 (包含自訂標籤長按刪除/修改)
  function renderFormChips() {
    const cat = editingId ? formState.category : currentCategory;

    // 1. 品牌
    renderChipGroup('brandChips', customBrands, formState.brand, val => formState.brand = val, true, (newArr) => {
      customBrands = newArr;
      localStorage.setItem('jcs_brands', JSON.stringify(customBrands));
    });

    // 2. 邊框顏色
    const borderList = (cat === 'Filter') ? customBordersFilter : customBordersGeneral;
    renderChipGroup('borderChips', borderList, formState.border, val => formState.border = val, true, (newArr) => {
      if (cat === 'Filter') { customBordersFilter = newArr; localStorage.setItem('jcs_border_filter', JSON.stringify(customBordersFilter)); }
      else { customBordersGeneral = newArr; localStorage.setItem('jcs_border_general', JSON.stringify(customBordersGeneral)); }
    });

    // 3. 玻璃顏色
    renderChipGroup('glassChips', customGlasses, formState.glass, val => formState.glass = val, true, (newArr) => {
      customGlasses = newArr;
      localStorage.setItem('jcs_glasses', JSON.stringify(customGlasses));
    });

    // 4. 配件類別
    renderChipGroup('accTypeChips', customAccessoryTypes, formState.accType, val => formState.accType = val, true, (newArr) => {
      customAccessoryTypes = newArr;
      localStorage.setItem('jcs_acc_types', JSON.stringify(customAccessoryTypes));
    });

    // 5. Condition
    renderChipGroup('conditionChips', ['S', 'A', 'B', 'C'], formState.condition, val => formState.condition = val);

    // 6. 原裝包裝 (新增「無」選項)
    renderChipGroup('packageChips', ['無', '有盒裝', '皮套/袋', '原廠盒裝'], formState.package, val => formState.package = val);

    // 7. 售出紀錄
    renderChipGroup('soldChips', ['在庫', '已售出'], formState.status, val => formState.status = val);
  }

  // 標籤渲染輔助函式
  function renderChipGroup(containerId, options, currentValue, onSelect, allowCustom = false, onCustomUpdate = null) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    options.forEach(opt => {
      const chip = document.createElement('div');
      chip.className = `chip ${currentValue === opt ? 'selected' : ''}`;
      chip.innerText = opt;
      chip.onclick = () => {
        onSelect(opt);
        renderFormChips();
        generateAiText();
      };

      // 可自訂標籤支援長按/右鍵刪除與修改
      if (allowCustom && onCustomUpdate) {
        let timer = null;
        const start = () => {
          timer = setTimeout(() => handleCustomTagEdit(opt, options, onCustomUpdate), 700);
        };
        const cancel = () => { if (timer) clearTimeout(timer); };

        chip.addEventListener('touchstart', start);
        chip.addEventListener('touchend', cancel);
        chip.addEventListener('touchmove', cancel);
        chip.addEventListener('mousedown', start);
        chip.addEventListener('mouseup', cancel);
        chip.addEventListener('mouseleave', cancel);
        chip.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          handleCustomTagEdit(opt, options, onCustomUpdate);
        });
      }

      container.appendChild(chip);
    });

    if (allowCustom && onCustomUpdate) {
      const addBtn = document.createElement('div');
      addBtn.className = 'chip chip-add';
      addBtn.innerText = '+ 自訂';
      addBtn.onclick = () => {
        const val = prompt('請輸入新增標籤名稱：');
        if (val && val.trim()) {
          const trimmed = val.trim();
          if (!options.includes(trimmed)) {
            const updated = [...options, trimmed];
            onCustomUpdate(updated);
            onSelect(trimmed);
            renderFormChips();
            generateAiText();
          }
        }
      };
      container.appendChild(addBtn);
    }
  }

  // 處理自訂標籤 修改/刪除
  function handleCustomTagEdit(targetTag, currentList, onCustomUpdate) {
    const action = prompt(`針對標籤「${targetTag}」進行操作：\n輸入 1：修改名稱\n輸入 2：刪除標籤`, '1');
    if (action === '1') {
      const newName = prompt('請輸入新名稱：', targetTag);
      if (newName && newName.trim() && newName.trim() !== targetTag) {
        const updated = currentList.map(item => item === targetTag ? newName.trim() : item);
        onCustomUpdate(updated);
        renderFormChips();
      }
    } else if (action === '2') {
      if (confirm(`確定要刪除標籤「${targetTag}」嗎？`)) {
        const updated = currentList.filter(item => item !== targetTag);
        onCustomUpdate(updated);
        renderFormChips();
      }
    }
  }

  // 圖片上傳處理
  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const max_size = 800;

        if (width > height) {
          if (width > max_size) { height *= max_size / width; width = max_size; }
        } else {
          if (height > max_size) { width *= max_size / height; height = max_size; }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        currentImageData = canvas.toDataURL('image/jpeg', 0.7);
        const previewImg = document.getElementById('previewImg');
        previewImg.src = currentImageData;
        previewImg.classList.remove('hidden');
        document.getElementById('uploadPlaceholder').classList.add('hidden');
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 自動產生 AI 賣場文字
  function generateAiText() {
    const model = document.getElementById('model').value.trim();
    const func = document.getElementById('functionDesc').value.trim();
    const cat = editingId ? formState.category : currentCategory;

    let titleParts = [];
    if (formState.brand) titleParts.push(formState.brand);
    if (model) titleParts.push(model);
    if (cat === 'Filter' && formState.glass) titleParts.push(formState.glass);

    let text = `【 John Camera Store 】\n`;
    text += `品名：${titleParts.join(' ') || '相機器材'}\n`;
    text += `品項狀況：Condition ${formState.condition || 'A'}\n`;
    if (formState.border) text += `外觀顏色：${formState.border}\n`;
    if (formState.package) text += `原裝配件：${formState.package}\n`;
    if (func) text += `功能說明：${func}\n`;
    text += `\n二手品項均經過測試，歡迎細看圖片討論細節。`;

    document.getElementById('aiPreview').innerText = text;
  }

  function copyAiText() {
    const text = document.getElementById('aiPreview').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert('已複製賣場內文至剪貼簿！');
    });
  }

  // 儲存表單
  function handleFormSubmit(e) {
    e.preventDefault();

    const newItem = {
      id: editingId || Date.now().toString(),
      category: editingId ? formState.category : currentCategory,
      brand: formState.brand,
      model: document.getElementById('model').value.trim(),
      border: formState.border,
      glass: formState.glass,
      accType: formState.accType,
      condition: formState.condition,
      package: formState.package,
      functionDesc: document.getElementById('functionDesc').value.trim(),
      location: document.getElementById('location').value.trim(),
      status: formState.status || '在庫',
      image: currentImageData,
      updatedAt: new Date().toLocaleString()
    };

    if (editingId) {
      const idx = db.findIndex(x => x.id === editingId);
      if (idx !== -1) db[idx] = newItem;
    } else {
      db.unshift(newItem);
    }

    localStorage.setItem('john_camera_db', JSON.stringify(db));
    showStep2();
    renderCategories();
    syncToCloud();
  }

  // 初始化載入
  fetchCloudData();
  renderCategories();
</script>
